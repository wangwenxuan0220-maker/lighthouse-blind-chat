<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>原来是你 · Lighthouse</title><link rel="stylesheet" href="room.css"><script src="config.js"></script><script src="room.js" defer></script></head><body><header><a href="./">lighthouse <small>ENGLISH NIGHT</small></a><a href="../topics/" target="_blank" rel="noopener">话题盲盒 ↗</a></header><main><p class="eyebrow">WHO SAID THAT?</p><h1>原来是你<span>从一句话，认识彼此。</span></h1><p id="status" role="status" aria-live="polite"></p><section id="entry"><form id="create"><h2>开始一场临时活动</h2><label>活动名称<input name="title" maxlength="80" required placeholder="灯塔英语夜"></label><label>今天聊什么<textarea name="topic" maxlength="200" required placeholder="大家常以为我是……，但其实我……"></textarea></label><label>桌名（可选，一行一桌）<textarea name="tables" placeholder="留空就是大家一起玩，没有人数限制"></textarea></label><button>创建活动</button><p class="muted">不需要参与者账号。资料仅供本场使用，结束即清空；房间最长保留12小时，服务重启也会清空。</p></form></section><section id="join" hidden><h2 id="join-title"></h2><p id="join-topic"></p><form id="join-form"></form></section><section id="room" hidden><div class="heading"><h2 id="room-title"></h2><span id="counts"></span></div><p id="topic"></p><p id="expiry" class="muted"></p><section id="host" hidden><details><summary>邀请大家 · 活动二维码</summary><img id="qr" width="240" height="240" alt="活动加入二维码"><label>参与者入口<input id="invite" readonly></label><button id="copy" type="button">复制链接</button><p class="muted">分享此入口即可。不要分享主持人页面的浏览器会话。</p></details><nav id="phases"><button data-phase="intro">自我介绍</button><button data-phase="collect">写一句话</button><button data-phase="wall">锁定并展示</button><button data-phase="reveal">猜人与揭晓</button></nav><label id="table-label" hidden>查看哪桌<select id="table-filter"></select></label><div class="tools"><button id="round" type="button">新一轮</button><button id="end" type="button" class="danger">结束并清空</button></div></section><section id="participant" hidden><details><summary>我的身份卡 · 修改资料</summary><form id="profile"></form></details><form id="sentence"><label>写一句与今天主题有关的话<textarea name="text" maxlength="240" placeholder="People often think I’m …, but actually I’m …"></textarea></label><p class="muted">支持中英文。先匿名展示，揭晓时会显示你的昵称；不要在句子中写自己的名字。留空保存可撤回。</p><button>保存我的句子</button><button id="withdraw" type="button" class="secondary">撤回 / 跳过</button></form></section><h3 id="stage-title"></h3><div id="people"></div><p id="wall-note" class="muted"></p><div id="wall"></div></section><dialog id="card-dialog"><button id="close-card" class="close" aria-label="关闭">×</button><p id="card-text"></p><div id="card-author"></div><button id="reveal">原来是谁？ · Reveal</button><button id="hide-card" class="secondary">隐藏这句话</button></dialog></main><footer>一句话也好，一段故事也好。所有环节都可以跳过。</footer></body></html>
